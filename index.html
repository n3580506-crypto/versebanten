<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GirangVerse — Banten Girang</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#101713;color:#f6efd9;overflow:hidden}
#app{height:100vh;position:relative;background:linear-gradient(#8eb6a0,#d4c79d)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
.hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.brand,.stats,.panel,.login{background:rgba(19,31,25,.9);border:1px solid rgba(241,207,119,.35);box-shadow:0 12px 35px #0005;border-radius:18px;backdrop-filter:blur(10px)}
.brand{padding:12px 16px}.brand b{color:#f1cf77}.brand small{display:block;color:#cfc6ad}.stats{padding:10px 14px;display:flex;gap:16px}.stats span{color:#f1cf77}
.panel{position:absolute;right:18px;top:92px;width:min(370px,calc(100vw - 36px));padding:18px;display:none}.panel.show{display:block}.panel h2{margin:0 0 6px}.muted{color:#c8c0aa;font-size:13px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#d6b45b;color:#17140d;font-weight:800;cursor:pointer;margin-top:10px}.btn.secondary{background:#35493d;color:#fff}.close{float:right;background:none;border:0;color:#fff;font-size:20px}
.login{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,90vw);padding:25px}.login h1{margin-top:0;color:#f1cf77}.login input{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #667267;background:#17221c;color:#fff}.login .btn{width:100%}.hint{font-size:12px;color:#bdb6a5;margin-top:10px}
.toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#14251c;border:1px solid #d6b45b;padding:12px 18px;border-radius:14px;display:none}
.controls{position:absolute;bottom:18px;left:18px;display:flex;gap:8px}.controls button{background:#18261f;color:#fff;border:1px solid #d6b45b66;border-radius:12px;padding:9px 12px}
@media(max-width:650px){.stats{gap:7px;font-size:12px}.brand{font-size:13px}.panel{top:82px}.controls{bottom:10px}}
</style>
</head>
<body>
<div id="app">
<canvas id="world"></canvas>
<div id="login" class="login">
<h1>GirangVerse</h1><p>Kota Banten Girang — Laboratorium Sejarah Interaktif</p>
<input id="username" placeholder="Username" value="siswa">
<input id="password" type="password" placeholder="Password" value="belajar123">
<button class="btn" onclick="login()">Masuk ke Kota</button>
<div class="hint">Demo: siswa / belajar123. Ganti akun sebelum digunakan di kelas.</div>
</div>
<div id="game" style="display:none">
<div class="hud">
<div class="brand"><b>GIRANGVERSE</b><small>Banten Girang • Rekonstruksi Edukatif</small></div>
<div class="stats">⭐ <span id="level">1</span> · XP <span id="xp">0</span> · 🪙 <span id="coins">100</span></div>
</div>
<div id="panel" class="panel"><button class="close" onclick="closePanel()">×</button><h2 id="ptitle"></h2><div id="pbody"></div></div>
<div class="controls"><button onclick="zoom(1.15)">＋</button><button onclick="zoom(.87)">－</button><button onclick="resetCam()">⌂ Kota</button><button onclick="logout()">Keluar</button></div>
</div>
<div id="toast" class="toast"></div>
</div>
<script>
const API="script.google.com/macros/s/AKfycbw-riRLrtfdJLhwLnDknMq7PKrg7cDQkJNnLRYTAerMs0Y0hsn1tXH6WA2IwUrnDxnb/exec";
let token="", me=null, buildings=[], missions=[], player=null;
const c=document.getElementById("world"),ctx=c.getContext("2d");
let W=0,H=0,cam={x:0,y:0,z:1},drag=false,last={x:0,y:0},npcs=[],playerPos={x:900,y:500};
const colors={grass:"#78986e",road:"#b89d72",water:"#4c8290",stone:"#8f8067",roof:"#6e4635",gold:"#d5b65e",tree:"#3f6744"};
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",resize);resize();
function worldToScreen(x,y){return {x:(x+cam.x)*cam.z,y:(y+cam.y)*cam.z}}
function screenToWorld(x,y){return {x:x/cam.z-cam.x,y:y/cam.z-cam.y}}
function draw(){
 ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();
 ctx.translate(0,0);ctx.fillStyle="#a9bf9b";ctx.fillRect(0,0,innerWidth,innerHeight);
 // river
 let p=worldToScreen(0,700);ctx.fillStyle=colors.water;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.bezierCurveTo(p.x+300*cam.z,p.y-200*cam.z,p.x+650*cam.z,p.y+260*cam.z,p.x+1600*cam.z,p.y-50*cam.z);ctx.lineTo(1600*cam.z,1000*cam.z);ctx.lineTo(0,1000*cam.z);ctx.fill();
 // grid/roads
 ctx.strokeStyle="#a48b63";ctx.lineWidth=52*cam.z;ctx.lineCap="round";road(250,520,1400,520);road(780,180,780,820);road(1130,220,1130,650);
 // trees
 for(let i=0;i<45;i++){let x=(i*283)%1500,y=120+(i*157)%720;if(x>650&&x<1250&&y>260&&y<650)continue;tree(x,y)}
 buildings.forEach(b=>drawBuilding(b));
 npcs.forEach(n=>{n.x+=n.vx;if(n.x>1450||n.x<120)n.vx*=-1;drawNPC(n.x,n.y,n.vx>0?"#e9c58b":"#c98c63")});
 drawNPC(playerPos.x,playerPos.y,"#f1cf77",true);
 ctx.restore();requestAnimationFrame(draw);
}
function road(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(worldToScreen(x1,y1).x,worldToScreen(x1,y1).y);ctx.lineTo(worldToScreen(x2,y2).x,worldToScreen(x2,y2).y);ctx.stroke()}
function tree(x,y){let p=worldToScreen(x,y),s=cam.z;ctx.fillStyle="#5d4937";ctx.fillRect(p.x-4*s,p.y,8*s,18*s);ctx.fillStyle=colors.tree;ctx.beginPath();ctx.arc(p.x,p.y-10*s,22*s,0,7);ctx.fill()}
function drawBuilding(b){
 if(Number(b.unlockXp)>Number(player?.xp||0)&&b.id!=="B01")return;
 let p=worldToScreen(Number(b.x),Number(b.y)),s=cam.z;let w=120*s,h=80*s;
 ctx.fillStyle=colors.stone;ctx.fillRect(p.x-w/2,p.y-h,w,h);
 ctx.fillStyle=colors.roof;ctx.beginPath();ctx.moveTo(p.x-w/2-8*s,p.y-h);ctx.lineTo(p.x,p.y-h-38*s);ctx.lineTo(p.x+w/2+8*s,p.y-h);ctx.closePath();ctx.fill();
 ctx.fillStyle="#201b14";ctx.fillRect(p.x-14*s,p.y-34*s,28*s,34*s);
 ctx.fillStyle="#f4e7bc";ctx.font=`${12*s}px system-ui`;ctx.textAlign="center";ctx.fillText(b.name,p.x,p.y+18*s);
 if(Number(b.unlockXp)>Number(player?.xp||0)){ctx.fillText("🔒 "+b.unlockXp+" XP",p.x,p.y+34*s)}
}
function drawNPC(x,y,color,hero=false){let p=worldToScreen(x,y),s=cam.z;ctx.fillStyle="#3b3027";ctx.fillRect(p.x-6*s,p.y,12*s,20*s);ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y-8*s,9*s,0,7);ctx.fill();if(hero){ctx.strokeStyle="#f7e7a8";ctx.lineWidth=2*s;ctx.strokeRect(p.x-12*s,p.y-29*s,24*s,52*s)}}
function showPanel(b){document.getElementById("ptitle").textContent=b.name;let ms=missions.filter(m=>m.buildingId===b.id);document.getElementById("pbody").innerHTML=`<p class="muted">${b.description||"Lokasi pembelajaran sejarah."}</p>`+(ms.map(m=>`<div style="margin-top:14px"><b>🎯 ${m.title}</b><p class="muted">${m.description}</p><button class="btn" onclick="finish('${m.id}')">Selesaikan Misi +${m.rewardXp} XP</button></div>`).join("")||"<p class='muted'>Belum ada misi untuk lokasi ini.</p>");document.getElementById("panel").classList.add("show")}
function closePanel(){document.getElementById("panel").classList.remove("show")}
c.addEventListener("click",e=>{if(!me)return;let q=screenToWorld(e.clientX,e.clientY);let b=buildings.find(b=>Math.abs(q.x-b.x)<80&&Math.abs(q.y-b.y)<65);if(b)showPanel(b)})
c.addEventListener("mousedown",e=>{drag=true;last={x:e.clientX,y:e.clientY}});addEventListener("mouseup",()=>drag=false);addEventListener("mousemove",e=>{if(drag){cam.x+=(e.clientX-last.x)/cam.z;cam.y+=(e.clientY-last.y)/cam.z;last={x:e.clientX,y:e.clientY}}});
c.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.08:.93)},{passive:false});
function zoom(v){cam.z=Math.max(.55,Math.min(1.7,cam.z*v))}
function resetCam(){cam={x:0,y:0,z:1}}
async function api(action,data={}){let r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,data,token})});let x=await r.json();if(!x.ok)throw Error(x.error||"API error");return x}
async function login(){try{const x=await api("login",{username:username.value,password:password.value});token=x.token;me=x.user;document.getElementById("login").style.display="none";document.getElementById("game").style.display="block";await load();toast("Selamat datang di Kota Banten Girang, "+me.name+"!")}catch(e){alert(e.message)}}
async function load(){let [b,m,p]=await Promise.all([api("buildings"),api("missions"),api("player")]);buildings=b.buildings;missions=m.missions;player=p.player;updateStats();npcs=Array.from({length:20},(_,i)=>({x:150+i*67,y:420+(i%5)*55,vx:(i%2?1:-1)*(.25+(i%4)*.08)}))}
async function finish(id){try{let reflection=prompt("Refleksi singkat: apa hal penting yang kamu pelajari?")||"";let x=await api("completeMission",{missionId:id,reflection});player=x.player;updateStats();toast(x.message);closePanel()}catch(e){alert(e.message)}}
function updateStats(){level.textContent=player.level;xp.textContent=player.xp;coins.textContent=player.coins}
async function logout(){try{await api("logout",{})}catch(e){}location.reload()}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2800)}
draw();
</script>
</body>
</html>
