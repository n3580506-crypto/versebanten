<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GirangVerse — Banten Girang</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#101d17;color:#fff}button,input,textarea{font:inherit}.hidden{display:none!important}#game{position:fixed;inset:0}canvas{width:100%;height:100%;display:block;background:#8ec7c5}.top{position:fixed;z-index:10;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;pointer-events:none}.brand,.hud{pointer-events:auto;background:#13281fe8;border:1px solid #d9bd7040;backdrop-filter:blur(10px);box-shadow:0 8px 30px #0003}.brand{padding:10px 15px;border-radius:16px;font-weight:900;color:#f4d77f}.hud{display:flex;gap:10px;padding:8px;border-radius:16px}.chip{padding:6px 10px;background:#234236;border-radius:11px;font-size:13px}.bottom{position:fixed;z-index:10;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;background:#13281fe8;padding:8px;border-radius:18px;border:1px solid #fff2}.bottom button,.btn{border:0;border-radius:12px;padding:10px 13px;background:#2d5c45;color:#fff;font-weight:800;cursor:pointer}.panel{position:fixed;z-index:20;right:16px;top:76px;width:min(390px,calc(100% - 32px));max-height:calc(100vh - 155px);overflow:auto;background:#f4ecd8;color:#203126;border-radius:22px;padding:20px;box-shadow:0 20px 60px #0008}.panel h2{margin:4px 0;color:#60451f}.close{float:right;border:0;background:none;font-size:25px}.tag{display:inline-block;background:#d9c77f;padding:5px 8px;border-radius:9px;font-size:12px}.mission{margin-top:14px;padding:13px;background:#fff9e9;border-radius:14px}.mission textarea{width:100%;min-height:88px;border:1px solid #c9b98d;border-radius:10px;padding:10px;margin:8px 0}.login{position:fixed;z-index:50;inset:0;background:linear-gradient(135deg,#0d2119,#234a36);display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:#f4ecd8;color:#213127;padding:28px;border-radius:26px;box-shadow:0 30px 80px #0007}.card h1{color:#6b4d22;margin:0}.card input{width:100%;padding:12px;margin-top:10px;border:1px solid #b9aa83;border-radius:12px}.small{font-size:12px;opacity:.75}.toast{position:fixed;z-index:80;left:50%;bottom:85px;transform:translateX(-50%);background:#10271f;padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px #0006}.npcLabel{font-size:11px}@media(max-width:650px){.brand{font-size:13px}.hud{gap:4px}.chip{font-size:11px;padding:6px}.bottom button{font-size:12px;padding:9px}.panel{top:70px}.hideMobile{display:none}}
</style></head><body><div id="game"><canvas id="c"></canvas></div><header class="top"><div class="brand">🏛️ GIRANGVERSE • BANTEN GIRANG</div><div class="hud"><div class="chip hideMobile" id="who">-</div><div class="chip">⭐ <b id="xp">0</b></div><div class="chip">🪙 <b id="coins">0</b></div></div></header><nav class="bottom"><button onclick="centerMap()">🗺️ Kota</button><button onclick="showHelp()">📜 Misi</button><button onclick="logout()">Keluar</button></nav><aside id="panel" class="panel hidden"><button class="close" onclick="panel.classList.add('hidden')">×</button><span class="tag" id="era"></span><h2 id="bname"></h2><p id="bdesc"></p><div id="missionBox"></div></aside><section id="login" class="login"><div class="card"><div class="small">LABORATORIUM SEJARAH INTERAKTIF</div><h1>Kota Banten Girang</h1><p>Jelajahi rekonstruksi edukatif kota, temui warga, buka bangunan, dan selesaikan misi sejarah.</p><input id="user" placeholder="Username" value="siswa"><input id="pass" type="password" placeholder="Password" value="belajar123"><button class="btn" style="width:100%;margin-top:12px" onclick="loginNow()">Masuk Kota</button><p class="small">Demo awal: siswa / belajar123. Ganti akun melalui database guru sebelum digunakan siswa.</p><p id="loginMsg" class="small"></p></div></section><div id="toast" class="toast hidden"></div><script>
const CONFIG_API='https://script.google.com/macros/s/AKfycbzp3S0dyZaV63B6SBuP32xWQ2_d04mMCROoR0kEmTRNmLl53NE0BdRv-2SkEuIXKvo9/exec';let token=localStorage.gvToken||'',DATA={buildings:[],missions:[],progress:[]},player={xp:0,coins:0};const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');let W,H,cam={x:0,y:0,zoom:1},drag=false,last={x:0,y:0},time=0;const npcs=Array.from({length:18},(_,i)=>({x:250+Math.random()*900,y:260+Math.random()*500,speed:14+Math.random()*18,dir:Math.random()*6.28,turn:Math.random()*3,name:['Warga','Pedagang','Pelajar','Pengrajin'][i%4]}));
function resize(){W=cvs.width=innerWidth*devicePixelRatio;H=cvs.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
async function api(action,payload={}){if(CONFIG_API.startsWith('PASTE_'))throw Error('Isi CONFIG_API dengan URL Web App Apps Script /exec.');const r=await fetch(CONFIG_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...payload}),redirect:'follow'});const t=await r.text();try{return JSON.parse(t)}catch(e){throw Error('Respons API tidak valid. Pastikan deployment Web App dapat diakses dan URL berakhir /exec.')}}
async function loginNow(){loginMsg.textContent='Menghubungkan...';try{let r=await api('login',{username:user.value,password:pass.value});if(!r.ok)throw Error(r.error);token=r.token;localStorage.gvToken=token;player=r.user;await loadGame();login.classList.add('hidden')}catch(e){loginMsg.textContent=e.message}}
async function loadGame(){let r=await api('gameData');if(!r.ok)throw Error(r.error);DATA=r;player=r.user;who.textContent=player.name+' • '+player.className;xp.textContent=player.xp;coins.textContent=player.coins}
async function logout(){try{await api('logout')}catch(e){}localStorage.removeItem('gvToken');token='';login.classList.remove('hidden')}
function iso(x,y){return{x:(x-y)*.62,y:(x+y)*.31}}
function tile(x,y,s=80){let p=iso(x,y);ctx.beginPath();ctx.moveTo(p.x,p.y-s*.25);ctx.lineTo(p.x+s*.62,p.y);ctx.lineTo(p.x,p.y+s*.25);ctx.lineTo(p.x-s*.62,p.y);ctx.closePath();ctx.fillStyle='#82aa62';ctx.fill();ctx.strokeStyle='#739657';ctx.stroke()}
function building(b){let x=Number(b.x)*11+140,y=Number(b.y)*7+100,p=iso(x,y),locked=player.xp<Number(b.unlockXP||0);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=locked?'#777':'#d2b875';ctx.fillRect(-25,-45,50,45);ctx.fillStyle=locked?'#555':'#714c2d';ctx.beginPath();ctx.moveTo(-32,-45);ctx.lineTo(0,-72);ctx.lineTo(32,-45);ctx.closePath();ctx.fill();ctx.fillStyle='#f5e7b6';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(b.name,0,18);if(locked){ctx.fillText('🔒 '+b.unlockXP+' XP',0,33)}ctx.restore();return{x:p.x,y:p.y}}
function drawWorld(dt){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(innerWidth/2+cam.x,80+cam.y);ctx.scale(cam.zoom,cam.zoom);for(let x=0;x<15;x++)for(let y=0;y<12;y++)tile(x*75,y*75);ctx.strokeStyle='#62a7b7';ctx.lineWidth=70;ctx.beginPath();ctx.moveTo(-500,430);ctx.bezierCurveTo(0,300,350,650,950,430);ctx.stroke();ctx.strokeStyle='#ccb982';ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(-250,180);ctx.lineTo(820,560);ctx.stroke();for(let i=0;i<40;i++){let p=iso((i*97)%1050,(i*173)%800);ctx.fillStyle='#285b35';ctx.beginPath();ctx.arc(p.x,p.y-12,10,0,7);ctx.fill();ctx.fillStyle='#5c422c';ctx.fillRect(p.x-2,p.y-4,4,14)}for(const b of DATA.buildings)building(b);for(const n of npcs){n.turn-=dt;if(n.turn<0){n.dir+=(-.8+Math.random()*1.6);n.turn=1+Math.random()*4}n.x+=Math.cos(n.dir)*n.speed*dt;n.y+=Math.sin(n.dir)*n.speed*dt;if(n.x<80||n.x>1050)n.dir=Math.PI-n.dir;if(n.y<80||n.y>800)n.dir=-n.dir;let p=iso(n.x,n.y);ctx.fillStyle='#51351f';ctx.fillRect(p.x-3,p.y-13,6,11);ctx.fillStyle='#e7b88a';ctx.beginPath();ctx.arc(p.x,p.y-17,4,0,7);ctx.fill()}ctx.restore()}
let prev=performance.now();function loop(now){let dt=Math.min(.04,(now-prev)/1000);prev=now;time+=dt;drawWorld(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
cvs.addEventListener('pointerdown',e=>{drag=true;last={x:e.clientX,y:e.clientY};cvs.setPointerCapture(e.pointerId)});cvs.addEventListener('pointermove',e=>{if(!drag)return;cam.x+=e.clientX-last.x;cam.y+=e.clientY-last.y;last={x:e.clientX,y:e.clientY}});cvs.addEventListener('pointerup',e=>{let moved=Math.hypot(e.clientX-last.x,e.clientY-last.y);drag=false;if(moved<8)pick(e.clientX,e.clientY)});cvs.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.max(.6,Math.min(1.7,cam.zoom*(e.deltaY>0?.9:1.1)))},{passive:false});
function pick(sx,sy){let best=null,bd=55;ctx.save();for(const b of DATA.buildings){let x=Number(b.x)*11+140,y=Number(b.y)*7+100,p=iso(x,y),px=innerWidth/2+cam.x+p.x*cam.zoom,py=80+cam.y+p.y*cam.zoom,d=Math.hypot(sx-px,sy-py);if(d<bd){best=b;bd=d}}ctx.restore();if(best)openBuilding(best)}
function openBuilding(b){era.textContent=b.era;bname.textContent=b.name;bdesc.textContent=b.description;let locked=player.xp<Number(b.unlockXP||0),m=DATA.missions.find(x=>x.buildingId===b.id),done=DATA.progress.some(x=>x.missionId===(m&&m.id)&&String(x.completed)==='true'||x.completed===true);missionBox.innerHTML=locked?'<div class="mission">🔒 Butuh '+b.unlockXP+' XP untuk membuka lokasi ini.</div>':m?'<div class="mission"><b>📜 '+m.title+'</b><p>'+m.description+'</p><p><b>Pertanyaan refleksi:</b> '+m.question+'</p>'+(done?'<b>✅ Misi selesai</b>':'<textarea id="ans" placeholder="Tulis jawaban berdasarkan sumber yang dipelajari..."></textarea><button class="btn" onclick="submitMission(\''+m.id+'\')">Kirim Misi</button>')+'</div>':'<div class="mission">Jelajahi lokasi ini dan pelajari konteksnya.</div>';panel.classList.remove('hidden')}
async function submitMission(id){try{let r=await api('saveMission',{missionId:id,answer:ans.value});if(!r.ok)throw Error(r.error);player=r.user;xp.textContent=player.xp;coins.textContent=player.coins;toastMsg('+'+(r.rewardXP||0)+' XP • Misi tersimpan');await loadGame();panel.classList.add('hidden')}catch(e){toastMsg(e.message)}}function toastMsg(s){toast.textContent=s;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),2600)}function centerMap(){cam={x:0,y:0,zoom:1}}function showHelp(){toastMsg('Klik bangunan di kota untuk melihat misi. Geser peta dan gunakan scroll untuk zoom.')}
(async()=>{if(token)try{await loadGame();login.classList.add('hidden')}catch(e){localStorage.removeItem('gvToken');token=''}})();
</script></body></html>
